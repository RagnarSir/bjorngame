name: Build & publish Windows installer

on:
  push:
    branches: [main]
    paths-ignore: ['**.md'] # spring tunge byg over ved rene dokument-ændringer
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Stigende version pr. build, så electron-updater ser det som en ny version
      - name: Sæt auto-version
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npm run build
      # Bygger installeren OG udgiver den til GitHub Releases inkl. latest.yml,
      # som auto-updateren bruger til at finde og hente opdateringer.
      - name: Byg + udgiv installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
